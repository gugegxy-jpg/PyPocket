name: PyPocket
options:
  bundleIdPrefix: app.pypocket
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_BUNDLE_IDENTIFIER: app.pypocket.ios
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  PyPocket:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      # runtime / Examples 由 scripts/embed_runtime.py 原样拷贝（保留目录结构），
      # 这里只放必须位于 .app 根目录的资源。
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - framework: Vendor/Python.xcframework
    settings:
      base:
        PRODUCT_NAME: PyPocket
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PyPocket-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "-ObjC"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
